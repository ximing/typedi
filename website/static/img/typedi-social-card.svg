<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0366d6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2188ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern overlay -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Main logo circle -->
  <circle cx="300" cy="315" r="120" fill="url(#logoGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>

  <!-- TypeScript "T" symbol in logo -->
  <text x="300" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="bold" fill="#0366d6" text-anchor="middle">T</text>

  <!-- Dependency injection arrows around logo -->
  <g stroke="rgba(255,255,255,0.8)" stroke-width="6" fill="none">
    <!-- Top arrow -->
    <path d="M300 100 L300 180 M270 150 L300 180 L330 150"/>
    <!-- Bottom arrow -->
    <path d="M300 530 L300 450 M270 480 L300 450 L330 480"/>
    <!-- Left arrow -->
    <path d="M100 315 L180 315 M150 285 L180 315 L150 345"/>
    <!-- Right arrow -->
    <path d="M500 315 L420 315 M450 285 L420 315 L450 345"/>
  </g>

  <!-- Main title -->
  <text x="650" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="start">TypeDI</text>

  <!-- Subtitle -->
  <text x="650" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="normal" fill="rgba(255,255,255,0.9)" text-anchor="start">Dependency Injection for TypeScript</text>

  <!-- Features -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)">
    <text x="650" y="420" text-anchor="start">• Simple decorator-based API</text>
    <text x="650" y="460" text-anchor="start">• Full TypeScript support</text>
    <text x="650" y="500" text-anchor="start">• Lightweight & zero dependencies</text>
  </g>

  <!-- GitHub link -->
  <text x="1050" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.7)" text-anchor="end">github.com/ximing/typedi</text>
</svg>